name: Sync Spond events to Google Calendar

on:
  schedule:
    # Every 30 minutes. GitHub may delay this slightly under load; that's fine
    # for a calendar sync. Adjust the cron expression if you want a different
    # cadence (this is UTC time).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"  # required so this job can request a Google OIDC token
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud (Workload Identity Federation, no key file)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Run sync
        env:
          SPOND_USERNAME: ${{ secrets.SPOND_USERNAME }}
          SPOND_PASSWORD: ${{ secrets.SPOND_PASSWORD }}
          SPOND_GROUP_ID: ${{ secrets.SPOND_GROUP_ID }}
          SPOND_SUBGROUP_ID: ${{ secrets.SPOND_SUBGROUP_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          # Domain-wide delegation (recommended for a Workspace-owned calendar -
          # bypasses external-sharing restrictions entirely). Leave both unset
          # to fall back to plain calendar sharing instead.
          GOOGLE_DELEGATED_USER: ${{ secrets.GOOGLE_DELEGATED_USER }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          EVENT_TIMEZONE: "Europe/Oslo"
        run: python sync.py
